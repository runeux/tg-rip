services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 3m
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8793:8080"
    volumes:
      - ./state:/state
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:8080/healthz')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis:
